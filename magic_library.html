<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>魔法圖書館：典籍歸序</title>
<style>
/* ============ 基礎與變數 ============ */
:root{
  --bg-deep:#0a0e1a;
  --bg-mid:#111a2e;
  --bg-green:#0f1f1c;
  --gold:#d4af37;
  --gold-soft:#c9a96e;
  --gold-dim:rgba(212,175,55,.35);
  --paper:#f5e6c8;
  --paper-dim:#e8d5a3;
  --paper-faded:#c9b489;
  --ink:#2a2418;
  --panel:rgba(20,28,46,.82);
  --panel-border:rgba(212,175,55,.35);
  --danger:#b85450;
  --ok:#7fae6e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:"Noto Serif TC","Songti SC","Source Han Serif TC","PMingLiU",serif;
  background:radial-gradient(ellipse at 50% 30%,#16223d 0%,var(--bg-mid) 45%,var(--bg-deep) 100%);
  color:var(--paper);
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  position:relative;
}
/* 背景動態層 */
#bgLayers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.particle{position:absolute;opacity:0;animation:floatUp linear infinite;}
@keyframes floatUp{
  0%{transform:translateY(105vh) translateX(0) rotate(0deg);opacity:0;}
  10%{opacity:.55;}
  90%{opacity:.35;}
  100%{transform:translateY(-10vh) translateX(30px) rotate(360deg);opacity:0;}
}
.dust{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--gold) 0%,transparent 70%);opacity:.3;animation:dustFloat ease-in-out infinite;}
@keyframes dustFloat{
  0%,100%{transform:translate(0,0);opacity:.15;}
  50%{transform:translate(20px,-30px);opacity:.5;}
}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.55) 100%);}

/* ============ 畫面切換 ============ */
.screen{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  padding:16px;overflow-y:auto;
  opacity:0;pointer-events:none;transition:opacity .5s ease,transform .5s ease;
  transform:translateY(12px);
}
.screen.active{opacity:1;pointer-events:auto;transform:translateY(0);}

/* ============ 共用元件 ============ */
.btn{
  font-family:inherit;cursor:pointer;
  background:linear-gradient(180deg,rgba(60,48,24,.85),rgba(35,28,15,.9));
  color:var(--paper);border:1px solid var(--gold-soft);
  padding:12px 28px;font-size:16px;letter-spacing:2px;
  border-radius:4px;position:relative;
  box-shadow:0 0 12px rgba(212,175,55,.15),inset 0 0 8px rgba(212,175,55,.08);
  transition:all .25s ease;
}
.btn:hover,.btn:active{background:linear-gradient(180deg,rgba(90,72,36,.9),rgba(55,44,22,.95));box-shadow:0 0 20px rgba(212,175,55,.35);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.primary{border-color:var(--gold);color:#fff3d6;}
.btn.small{padding:8px 16px;font-size:13px;letter-spacing:1px;}

.panel{
  background:var(--panel);border:1px solid var(--panel-border);
  border-radius:6px;padding:16px;
  box-shadow:0 4px 24px rgba(0,0,0,.5),inset 0 0 30px rgba(212,175,55,.04);
  backdrop-filter:blur(4px);
}

h1,h2,h3{font-weight:normal;letter-spacing:4px;}
.title-glow{color:var(--gold);text-shadow:0 0 18px rgba(212,175,55,.6),0 0 40px rgba(212,175,55,.3);}

/* ============ 標題畫面 ============ */
#screen-title{justify-content:center;}
#screen-title .library-mark{margin-bottom:24px;}
#screen-title h1{font-size:32px;text-align:center;line-height:1.6;margin-bottom:8px;}
#screen-title .subtitle{color:var(--paper-faded);letter-spacing:6px;font-size:13px;margin-bottom:48px;text-align:center;}
#screen-title .btn-row{display:flex;flex-direction:column;gap:14px;width:240px;}

/* ============ 頂欄 ============ */
.topbar{
  width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center;
  padding:8px 4px;margin-bottom:12px;
}
.topbar .back-btn{color:var(--paper-dim);cursor:pointer;font-size:14px;letter-spacing:2px;}
.topbar .back-btn:hover{color:var(--gold);}
.order-display{
  display:flex;align-items:center;gap:6px;
  background:rgba(20,28,46,.7);border:1px solid var(--gold-dim);
  padding:6px 14px;border-radius:20px;font-size:14px;color:var(--gold-soft);
}
.order-display svg{width:16px;height:16px;}

/* ============ 大廳 ============ */
#screen-hall .hall-title{margin:8px 0 4px;font-size:22px;}
#screen-hall .hall-sub{color:var(--paper-faded);font-size:13px;margin-bottom:18px;letter-spacing:2px;}
.vault-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:12px;width:100%;max-width:720px;
}
.vault-card{
  background:var(--panel);border:1px solid var(--panel-border);border-radius:6px;
  padding:16px 12px;text-align:center;cursor:pointer;transition:all .3s;
  position:relative;overflow:hidden;
}
.vault-card:not(.locked):hover{border-color:var(--gold);box-shadow:0 0 18px rgba(212,175,55,.25);transform:translateY(-2px);}
.vault-card.locked{opacity:.5;cursor:not-allowed;filter:grayscale(.6);}
.vault-card .vault-icon{width:48px;height:48px;margin:0 auto 8px;}
.vault-card .vault-name{font-size:15px;letter-spacing:2px;margin-bottom:4px;}
.vault-card .vault-desc{font-size:11px;color:var(--paper-faded);line-height:1.5;min-height:30px;}
.vault-card .vault-progress{font-size:11px;color:var(--gold-soft);margin-top:6px;}
.lock-badge{position:absolute;top:6px;right:8px;font-size:10px;color:var(--paper-faded);}

.bottom-nav{
  margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
}
.bottom-nav .nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 14px;background:var(--panel);border:1px solid var(--panel-border);
  border-radius:6px;cursor:pointer;font-size:11px;color:var(--paper-dim);min-width:72px;
}
.bottom-nav .nav-btn svg{width:22px;height:22px;}
.bottom-nav .nav-btn:hover{border-color:var(--gold);color:var(--gold);}

/* ============ 關卡列表 ============ */
.level-list{width:100%;max-width:720px;display:flex;flex-direction:column;gap:10px;}
.level-card{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--panel);border:1px solid var(--panel-border);border-radius:6px;
  cursor:pointer;transition:all .25s;
}
.level-card:not(.locked):hover{border-color:var(--gold);box-shadow:0 0 14px rgba(212,175,55,.2);}
.level-card.locked{opacity:.45;cursor:not-allowed;}
.level-card .lv-icon{width:36px;height:36px;flex-shrink:0;}
.level-card .lv-info{flex:1;min-width:0;}
.level-card .lv-name{font-size:15px;letter-spacing:1px;}
.level-card .lv-meta{font-size:11px;color:var(--paper-faded);margin-top:3px;}
.level-card .lv-stars{font-size:13px;color:var(--gold);letter-spacing:2px;}
.level-card .lv-stars .star-empty{color:#4a4438;}

/* ============ 解謎區 ============ */
#screen-puzzle .puzzle-header{width:100%;max-width:720px;text-align:center;margin-bottom:10px;}
#screen-puzzle .puzzle-book{font-size:18px;color:var(--gold);letter-spacing:3px;}
#screen-puzzle .puzzle-disorder{font-size:12px;color:var(--paper-faded);margin-top:4px;letter-spacing:2px;}
#screen-puzzle .puzzle-hint{font-size:12px;color:var(--paper-dim);margin-top:6px;line-height:1.6;min-height:18px;}
.puzzle-area{
  width:100%;max-width:720px;flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:10px;
}
.puzzle-actions{display:flex;gap:10px;margin-top:8px;}

/* ===== 打開的透明書本（書頁排序新玩法） ===== */
.book-stage{
  position:relative;width:100%;max-width:560px;display:flex;align-items:center;justify-content:center;
  perspective:1600px;margin:4px 0;
}
.open-book{
  position:relative;width:420px;max-width:90vw;height:300px;
  transform-style:preserve-3d;
  /* 書本整體外影 */
  filter:drop-shadow(0 12px 24px rgba(0,0,0,.6));
}
/* 書脊中線 */
.open-book::before{
  content:'';position:absolute;top:0;bottom:0;left:50%;width:14px;
  transform:translateX(-50%);z-index:5;pointer-events:none;
  background:linear-gradient(to right,
    transparent 0%,
    rgba(0,0,0,.35) 30%,
    rgba(20,12,6,.6) 50%,
    rgba(0,0,0,.35) 70%,
    transparent 100%);
}
/* 頁邊厚度（右側與底部堆疊線） */
.open-book::after{
  content:'';position:absolute;top:4px;bottom:4px;right:-3px;width:4px;
  background:repeating-linear-gradient(to bottom,
    #e8d5a3 0px,#e8d5a3 1px,#c9b489 1px,#c9b489 2px);
  border-radius:0 2px 2px 0;box-shadow:1px 0 2px rgba(0,0,0,.3);
  pointer-events:none;z-index:4;
}
.book-spread{
  position:absolute;inset:0;display:flex;opacity:0;pointer-events:none;
  transition:transform .5s ease, opacity .5s ease;
  transform-origin:left center;
}
.book-spread.active{opacity:1;pointer-events:auto;}
.book-spread.flip-next{transform:rotateY(-12deg);opacity:0;}
.book-spread.flip-prev{transform:rotateY(12deg);opacity:0;}
.bpage{
  flex:1;position:relative;
  background:linear-gradient(160deg, rgba(245,230,200,.14) 0%, rgba(232,213,163,.10) 100%);
  border:1px solid rgba(212,175,55,.2);
  display:flex;align-items:center;justify-content:center;
  padding:14px;opacity:.92;overflow:hidden;
}
.bpage.left{
  border-radius:8px 2px 2px 8px;border-right:none;
  /* 靠近書脊處陰影凹陷 */
  background-image:
    linear-gradient(to left, rgba(0,0,0,.3) 0%, transparent 18%),
    radial-gradient(circle at 30% 40%, rgba(139,111,60,.08) 0.5px, transparent 1.5px),
    linear-gradient(160deg, rgba(245,230,200,.14), rgba(232,213,163,.10));
  background-size:auto, 7px 7px, 100% 100%;
}
.bpage.right{
  border-radius:2px 8px 8px 2px;border-left:none;
  background-image:
    linear-gradient(to right, rgba(0,0,0,.3) 0%, transparent 18%),
    radial-gradient(circle at 70% 60%, rgba(139,111,60,.08) 0.5px, transparent 1.5px),
    linear-gradient(200deg, rgba(245,230,200,.14), rgba(232,213,163,.10));
  background-size:auto, 9px 9px, 100% 100%;
}
.bpage-label{position:absolute;top:8px;font-size:10px;color:var(--gold-soft);letter-spacing:2px;opacity:.7;}

/* 封面/封底硬殼 */
.bpage.cover-page{
  background:
    radial-gradient(circle at 25% 25%, rgba(212,175,55,.08) 0.5px, transparent 1.5px),
    linear-gradient(150deg, #3d2b1f 0%, #2a1d14 60%, #1f150d 100%);
  background-size:8px 8px, 100% 100%;
  border:1px solid var(--gold-soft);
  flex-direction:column;gap:10px;
}
.bpage.left.cover-page{border-right:1px solid var(--gold-soft);}
.bpage.right.cover-page{border-left:1px solid var(--gold-soft);}
.cover-ornament{margin-top:20px;opacity:.85;}
.cover-title{
  color:var(--gold);font-size:15px;letter-spacing:3px;text-align:center;
  text-shadow:0 0 12px rgba(212,175,55,.4);line-height:1.6;
}
.cover-sub{color:var(--paper-faded);font-size:10px;letter-spacing:4px;opacity:.7;}

.page-slot{
  width:88%;height:78%;border:1.5px dashed rgba(212,175,55,.4);border-radius:4px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .25s;position:relative;
}
.page-slot:hover{border-color:var(--gold);background:rgba(212,175,55,.06);}
.page-slot.filled{border-style:solid;border-color:transparent;}
.page-slot.error{border-color:var(--danger)!important;box-shadow:0 0 14px rgba(184,84,80,.6);}
.page-slot .slot-hint{font-size:11px;color:var(--paper-faded);}

/* 老紙紙條 */
.paper-slip{
  background:linear-gradient(135deg,#f5e6c8 0%,#e8d5a3 60%,#d4c089 100%);
  color:var(--ink);padding:10px 12px;width:130px;min-height:70px;
  font-size:11px;line-height:1.6;cursor:pointer;position:relative;
  border-radius:2px 6px 4px 3px;
  box-shadow:2px 3px 8px rgba(0,0,0,.5);
  transition:all .2s;
  /* 紙紋 */
  background-image:
    radial-gradient(circle at 20% 30%, rgba(139,111,60,.12) 0.5px, transparent 1px),
    radial-gradient(circle at 70% 60%, rgba(139,111,60,.10) 0.5px, transparent 1px),
    linear-gradient(135deg,#f5e6c8 0%,#e8d5a3 60%,#d4c089 100%);
  background-size:6px 6px, 9px 9px, 100% 100%;
}
.paper-slip::after{
  content:'';position:absolute;right:0;bottom:0;width:18px;height:18px;
  background:linear-gradient(135deg, transparent 50%, rgba(0,0,0,.25) 50%, #c9b489 100%);
  border-radius:0 0 4px 0;
}
.paper-slip.selected{outline:2px solid var(--gold);outline-offset:2px;transform:scale(1.05) rotate(-1deg);box-shadow:0 0 18px rgba(212,175,55,.6);}
.paper-slip.placed{display:none;}
.paper-slip .slip-text{display:block;}
.paper-slip .slip-num{position:absolute;bottom:3px;right:6px;font-size:9px;color:#8a7a55;}

/* 書本上已貼的紙條 */
.page-slot .paper-slip{width:92%;min-height:80px;cursor:pointer;}
.page-slot .paper-slip.placed{display:block;opacity:1;}
.page-slot.error .paper-slip{box-shadow:0 0 14px rgba(184,84,80,.7);}

.book-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border-radius:50%;cursor:pointer;
  background:rgba(20,28,46,.8);border:1px solid var(--gold-soft);
  display:flex;align-items:center;justify-content:center;z-index:5;
  transition:all .2s;color:var(--gold);
}
.book-nav:hover{background:rgba(60,48,24,.9);box-shadow:0 0 12px rgba(212,175,55,.4);}
.book-nav.disabled{opacity:.3;cursor:not-allowed;}
.book-nav.prev{left:-44px;}
.book-nav.next{right:-44px;}

/* 小書（法則歸類用） */
.mini-book{
  width:44px;height:62px;position:relative;cursor:pointer;
  border-radius:2px 4px 4px 2px;
  box-shadow:2px 3px 6px rgba(0,0,0,.5), inset -1px 0 2px rgba(0,0,0,.3);
  transition:all .2s;display:flex;flex-direction:column;
}
.mini-book:hover{transform:translateY(-3px);}
.mini-book.selected{outline:2px solid var(--gold);outline-offset:2px;transform:scale(1.08);}
.mini-book .mb-spine{
  position:absolute;left:0;top:0;bottom:0;width:10px;
  background:rgba(0,0,0,.3);border-radius:2px 0 0 2px;
}
.mini-book .mb-cover{
  flex:1;margin-left:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;padding:4px;
  border-radius:0 3px 3px 0;
}
.mini-book .mb-icon{width:18px;height:18px;}
.mini-book .mb-label{font-size:9px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);letter-spacing:1px;}
.mini-book.placed{opacity:.25;pointer-events:none;}
.zone-cards .mini-book{margin:2px;}

/* 殘頁 / 書架 網格 */
.puzzle-grid{display:grid;gap:6px;}
.grid-slot{
  background:rgba(245,230,200,.06);border:1px dashed var(--gold-dim);
  border-radius:4px;display:flex;align-items:center;justify-content:center;
  position:relative;
}
.grid-slot.filled{border-style:solid;border-color:var(--gold-dim);}
.grid-slot.locked{border-style:solid;border-color:var(--gold);box-shadow:inset 0 0 10px rgba(212,175,55,.2);}
.tray{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  min-height:60px;padding:8px;max-width:600px;
}
.tray-piece{
  cursor:pointer;border-radius:4px;transition:all .2s;
  box-shadow:0 2px 6px rgba(0,0,0,.4);
}
.tray-piece.selected{outline:2px solid var(--gold);outline-offset:2px;transform:scale(1.05);}
.tray-piece.placed{display:none;}

/* 符文 */
.rune-circle{position:relative;width:280px;height:280px;}
.rune-node{
  position:absolute;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle,rgba(40,55,85,.9),rgba(20,28,46,.95));
  border:2px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .3s;font-size:20px;color:var(--paper-dim);
}
.rune-node.lit{background:radial-gradient(circle,rgba(212,175,55,.5),rgba(140,110,40,.8));border-color:var(--gold);color:#fff;box-shadow:0 0 20px rgba(212,175,55,.7);}
.rune-node.wrong{animation:shake .4s;border-color:var(--danger);}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.rune-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,.15),transparent 70%);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gold-soft);text-align:center;line-height:1.4;
}

/* 歸類 */
.cate-zones{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.cate-zone{
  min-width:130px;min-height:120px;padding:10px;border-radius:6px;
  background:rgba(245,230,200,.05);border:1px dashed var(--gold-dim);
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.cate-zone .zone-title{font-size:13px;color:var(--gold-soft);letter-spacing:2px;}
.cate-zone.correct{border-style:solid;border-color:var(--ok);}
.law-card{
  background:linear-gradient(160deg,var(--paper),var(--paper-dim));color:var(--ink);
  padding:8px 12px;border-radius:4px;font-size:12px;cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.4);transition:all .2s;max-width:160px;text-align:center;
}
.law-card.selected{outline:2px solid var(--gold);transform:scale(1.05);}
.law-card.placed{opacity:.25;pointer-events:none;}

/* 法則約束排列 */
.constraint-rules{
  width:100%;max-width:600px;display:flex;flex-direction:column;gap:6px;margin-bottom:8px;
}
.rule-item{
  display:flex;align-items:center;gap:8px;
  background:rgba(245,230,200,.05);border:1px solid var(--gold-dim);
  border-radius:4px;padding:6px 10px;font-size:12px;color:var(--paper-dim);
  transition:all .3s;
}
.rule-item .rule-icon{width:28px;height:20px;flex-shrink:0;}
.rule-item.ok{border-color:var(--ok);color:var(--ok);}
.rule-item.bad{border-color:var(--danger);color:var(--danger);animation:shake .4s;}
.constraint-slots{
  display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0;
}
.cslot{
  width:64px;height:84px;border:2px dashed var(--gold-dim);border-radius:4px;
  background:rgba(245,230,200,.04);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;
}
.cslot.filled{border-style:solid;border-color:var(--gold-soft);}
.cslot.violation{border-color:var(--danger);box-shadow:0 0 12px rgba(184,84,80,.5);animation:shake .4s;}
.cpiece{
  background:linear-gradient(160deg,var(--paper),var(--paper-dim));color:var(--ink);
  border-radius:4px;padding:10px 8px;font-size:12px;letter-spacing:1px;
  cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4);text-align:center;
  transition:all .2s;writing-mode:vertical-rl;min-height:60px;
}
.cpiece.selected{outline:2px solid var(--gold);outline-offset:2px;transform:scale(1.05);}
.cpiece.placed{opacity:.2;pointer-events:none;}
.cslot .cpiece{writing-mode:horizontal-tb;min-height:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}

/* 解密 */
.decrypt-text{
  font-size:16px;line-height:2.2;letter-spacing:2px;text-align:center;
  max-width:560px;padding:16px;
}
.blank{
  display:inline-block;min-width:60px;border-bottom:2px solid var(--gold);
  color:var(--gold);padding:0 6px;margin:0 4px;cursor:pointer;
}
.blank.filled{color:var(--paper);}
.blank.correct{color:var(--ok);border-color:var(--ok);}
.blank.wrong{color:var(--danger);border-color:var(--danger);}
.choices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px;}
.choice-chip{
  padding:8px 16px;background:var(--panel);border:1px solid var(--gold-dim);
  border-radius:16px;cursor:pointer;font-size:13px;color:var(--paper);
}
.choice-chip:hover{border-color:var(--gold);color:var(--gold);}
.choice-chip.used{opacity:.25;pointer-events:none;}

/* ============ 彈窗：劇情 / 成功 ============ */
.overlay{
  position:fixed;inset:0;background:rgba(5,8,15,.85);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .4s;
}
.overlay.show{opacity:1;pointer-events:auto;}
.dialog-box{
  max-width:520px;width:100%;max-height:80vh;overflow-y:auto;
  background:linear-gradient(180deg,rgba(25,35,58,.97),rgba(15,22,38,.97));
  border:1px solid var(--gold-soft);border-radius:8px;padding:24px;
  box-shadow:0 0 40px rgba(212,175,55,.2);
}
.dialog-box .dlg-speaker{color:var(--gold);font-size:14px;letter-spacing:3px;margin-bottom:10px;}
.dialog-box .dlg-text{font-size:14px;line-height:2;min-height:80px;color:var(--paper);}
.dialog-box .dlg-actions{margin-top:18px;display:flex;gap:10px;justify-content:flex-end;}
.success-box{text-align:center;}
.success-box .success-icon{width:80px;height:80px;margin:0 auto 12px;}
.success-box h2{color:var(--gold);margin-bottom:10px;letter-spacing:4px;}
.success-box p{color:var(--paper-dim);font-size:13px;line-height:1.8;margin-bottom:8px;}
.success-box .reward{color:var(--gold);font-size:15px;margin:10px 0;}

/* ============ 圖鑑 / 書靈 / 升級 ============ */
.codex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%;max-width:720px;}
.codex-card{
  background:var(--panel);border:1px solid var(--panel-border);border-radius:6px;
  padding:12px;cursor:pointer;transition:all .25s;
}
.codex-card:hover{border-color:var(--gold);}
.codex-card.locked{opacity:.4;filter:grayscale(.8);}
.codex-card .book-spine{height:60px;border-radius:3px;margin-bottom:8px;position:relative;overflow:hidden;}
.codex-card .book-name{font-size:13px;letter-spacing:1px;}
.codex-card .book-vault{font-size:10px;color:var(--paper-faded);margin-top:3px;}

.spirit-list{width:100%;max-width:600px;display:flex;flex-direction:column;gap:12px;}
.spirit-card{display:flex;gap:14px;padding:14px;align-items:center;}
.spirit-card .spirit-portrait{
  width:80px;height:80px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle,rgba(212,175,55,.25),rgba(20,28,46,.9));
  border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;
}
.spirit-card .spirit-info h3{color:var(--gold);font-size:16px;letter-spacing:2px;margin-bottom:4px;}
.spirit-card .spirit-info p{font-size:12px;color:var(--paper-dim);line-height:1.7;}

.upgrade-list{width:100%;max-width:600px;display:flex;flex-direction:column;gap:10px;}
.upgrade-item{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px;background:var(--panel);border:1px solid var(--panel-border);border-radius:6px;
}
.upgrade-item .up-info{flex:1;}
.upgrade-item .up-name{font-size:14px;letter-spacing:1px;margin-bottom:3px;}
.upgrade-item .up-desc{font-size:11px;color:var(--paper-faded);line-height:1.5;}
.upgrade-item .up-cost{color:var(--gold);font-size:13px;white-space:nowrap;}

.empty-hint{color:var(--paper-faded);text-align:center;padding:40px 20px;font-size:13px;line-height:2;}

/* 提示 Toast */
#toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  background:rgba(20,28,46,.95);border:1px solid var(--gold-soft);color:var(--gold);
  padding:10px 20px;border-radius:20px;font-size:13px;z-index:200;
  opacity:0;pointer-events:none;transition:opacity .3s;letter-spacing:1px;
}
#toast.show{opacity:1;}

/* 滾動條 */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:3px;}

@media(max-width:480px){
  #screen-title h1{font-size:24px;}
  .page-card{width:74px;height:104px;font-size:10px;}
  .rune-circle{width:240px;height:240px;}
  .rune-node{width:48px;height:48px;font-size:17px;}
  .vault-grid{grid-template-columns:repeat(2,1fr);}
}
</style>

/* ---------- 存檔 ---------- */
const SAVE_KEY = 'magicLibrarySave_v1';
let S = loadGame();

function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){ return Object.assign(defaultState(), JSON.parse(raw)); }
  }catch(e){}
  return defaultState();
}
function defaultState(){
  return {
    orderPoints:0,
    completed:{},        // levelId -> stars
    codex:{},            // bookId -> true
    spirits:{},          // spiritId -> true
    upgrades:{},         // upId -> level
    muted:false,
    hasSave:false,
  };
}
function saveGame(){
  S.hasSave = true;
  localStorage.setItem(SAVE_KEY, JSON.stringify(S));
}

/* ---------- 音訊（Web Audio API） ---------- */
let audioCtx = null;
function ac(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  return audioCtx;
}
function tone(freq, dur=0.15, type='sine', vol=0.08){
  if(S.muted) return;
  const c = ac(); if(!c) return;
  const o = c.createOscillator(); const g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
  o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime+dur);
}
function sfxPickup(){ tone(660,0.08,'triangle',0.05); }
function sfxPlace(){ tone(440,0.1,'triangle',0.06); }
function sfxCorrect(){ tone(880,0.15,'sine',0.08); setTimeout(()=>tone(1320,0.2,'sine',0.07),100); }
function sfxWrong(){ tone(180,0.2,'sawtooth',0.05); }
function sfxSuccess(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.25,'sine',0.09),i*120)); }
function sfxPage(){ tone(220,0.06,'triangle',0.04); }

  const el = document.getElementById(id);
  el.classList.add('active');
  // 滾動到頂

/* ---------- Toast ---------- */
let toastTimer=null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------- 大廳渲染 ---------- */
function completedCount(vaultId){
  return LEVELS.filter(l=>l.vault===vaultId && S.completed[l.id]).length;
}
function totalCount(vaultId){
  return LEVELS.filter(l=>l.vault===vaultId).length;
}
function isVaultUnlocked(idx){
  if(idx===0) return true;
  const prev = VAULTS[idx-1];
  // 需要在前一典庫完成 currentVault.need 關
  return completedCount(prev.id) >= VAULTS[idx].need;
}

function renderHall(){
  document.getElementById('orderPoints').textContent = S.orderPoints;
  const grid = document.getElementById('vaultGrid');
  grid.innerHTML = '';
  VAULTS.forEach((v,i)=>{
    const unlocked = isVaultUnlocked(i);
    const c = completedCount(v.id), t = totalCount(v.id);
    const card = document.createElement('div');
    card.className = 'vault-card' + (unlocked?'':' locked');
    card.innerHTML = `
      ${unlocked?'':`<span class="lock-badge">${ICONS.locked}</span>`}
      <div class="vault-icon">${v.icon}</div>
      <div class="vault-name">${v.name}</div>
      <div class="vault-desc">${v.desc}</div>
      <div class="vault-progress">典籍 ${c}/${t}${unlocked?'':`　解鎖需前庫 ${v.need} 關`}</div>
    `;
    if(unlocked){
      card.onclick = ()=>{ sfxPage(); openVault(i); };
    }
    grid.appendChild(card);
  });
  document.getElementById('btnContinue').disabled = !S.hasSave;
}

/* ---------- 典庫關卡列表 ---------- */
let currentVaultIdx = 0;
function openVault(idx){
  currentVaultIdx = idx;
  const v = VAULTS[idx];
  document.getElementById('vaultTitle').textContent = v.name;
  document.getElementById('vaultDesc').textContent = v.desc;
  document.getElementById('vaultOrderPoints').textContent = S.orderPoints;
  const list = document.getElementById('levelList');
  list.innerHTML = '';
  LEVELS.filter(l=>l.vault===v.id).forEach((lv,i)=>{
    const done = S.completed[lv.id];
    const prevDone = i===0 || S.completed[LEVELS.filter(x=>x.vault===v.id)[i-1].id];
    const unlocked = prevDone || done;
    const card = document.createElement('div');
    card.className = 'level-card' + (unlocked?'':' locked');
    let starsHtml = '';
    if(done){
      starsHtml = [1,2,3].map(s=>s<=done?ICONS.starFilled:ICONS.starEmpty).join('');
    } else {
      starsHtml = `<span style="color:var(--paper-faded);font-size:11px;">${unlocked?'未通關':'未解鎖'}</span>`;
    }
    card.innerHTML = `
      <div class="lv-icon">${v.icon}</div>
      <div class="lv-info">
        <div class="lv-name">${lv.name}</div>
        <div class="lv-meta">錯亂類型：${lv.disorder}　·　獎勵 ${lv.reward}</div>
      </div>
      <div class="lv-stars">${starsHtml}</div>
    `;
    if(unlocked){
      card.onclick = ()=>startLevel(lv);
    }
    list.appendChild(card);
  });
  show('screen-vault');
}

/* ---------- 關卡進行 ---------- */
let currentLevel = null;
let puzzleState = null;

function startLevel(lv){
  currentLevel = lv;
  show('screen-puzzle');
  document.getElementById('puzzleBook').textContent = lv.name;
  document.getElementById('puzzleDisorder').textContent = '錯亂類型：' + lv.disorder;
  document.getElementById('puzzleHint').textContent = lv.hint;
  document.getElementById('puzzleOrder').textContent = S.orderPoints;
  // 劇情前對話
  showDialog('守典人', lv.storyBefore, ()=>{
    buildPuzzle(lv);
  });
}

function buildPuzzle(lv){
  const area = document.getElementById('puzzleArea');
  area.innerHTML = '';
  puzzleState = { type:lv.type, solved:false, data:{} };
  switch(lv.type){
    case 'order': buildOrder(lv, area); break;
    case 'piece': buildPiece(lv, area); break;
    case 'rune': buildRune(lv, area); break;
    case 'cate': buildCate(lv, area); break;
    case 'decrypt': buildDecrypt(lv, area); break;
    case 'shelf': buildShelf(lv, area); break;
    case 'constraint': buildConstraint(lv, area); break;
  }
}

/* ----- 1. 書頁排序（透明書本貼紙模式） ----- */
function buildOrder(lv, area){
  const n = lv.pages.length;
  // 打亂紙條
  const slips = [...lv.pages].sort(()=>Math.random()-0.5);
  puzzleState.data.slips = slips.map(p=>({...p}));
  puzzleState.data.placed = new Array(n).fill(null); // slot 1..n -> slip
  puzzleState.data.selectedSlip = null;
  puzzleState.data.state = 0;

  // 建立 spreads: [封面左半, (cb,p1), (p2,p3), ..., 封底右半]
  // state 0: 左=封面(半邊), 右=空白
  const spreads = [{left:'cover', right:null, label:''}];
  // state 1: 左=封面背(空白), 右=p1
  spreads.push({left:null,right:1,label:''});
  // 其餘成對
  let p = 2;
  while(p <= n){
    if(p+1 <= n){
      spreads.push({left:p, right:p+1, label:''});
    } else {
      spreads.push({left:p, right:null, label:''});
    }
    p += 2;
  }
  // last: 左=空白, 右=封底(半邊)
  spreads.push({left:null, right:'backcover', label:''});
  puzzleState.data.spreads = spreads;

  // 書本舞台
  const stage = document.createElement('div');
  stage.className = 'book-stage';
  stage.innerHTML = `
    <div class="open-book" id="openBook">
      <div class="book-spread" data-sp="0"></div>
    </div>
    <div class="book-nav prev" data-nav="prev">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
    </div>
    <div class="book-nav next" data-nav="next">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  `;
  area.appendChild(stage);
  puzzleState.data.stage = stage;

  // 待選紙條區
  const tray = document.createElement('div');
  tray.className = 'tray';
  tray.style.marginTop = '8px';
  puzzleState.data.tray = tray;
  area.appendChild(tray);

  // 檢查按鈕
  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn primary small';
  checkBtn.textContent = '檢查排序';
  checkBtn.onclick = checkOrderBook;
  area.appendChild(checkBtn);

  renderBook();
  renderTray();
}

function renderBook(){
  const stage = puzzleState.data.stage;
  const spreads = puzzleState.data.spreads;
  const sp = puzzleState.data.state;
  // 清除舊 spread
  stage.querySelectorAll('.book-spread').forEach(e=>e.remove());
  const spread = spreads[sp];
  const el = document.createElement('div');
  el.className = 'book-spread active';
  el.dataset.sp = sp;

  function makePage(side, pageNum){
    const pg = document.createElement('div');
    pg.className = 'bpage ' + side;
    if(pageNum==='cover'){
      // 封面半邊（左頁）
      pg.classList.add('cover-page');
      pg.innerHTML = `
        <div class="cover-ornament">
          <svg viewBox="0 0 40 40" width="36" height="36">
            <circle cx="20" cy="20" r="16" fill="none" stroke="#d4af37" stroke-width="1" opacity=".6"/>
            <circle cx="20" cy="20" r="10" fill="none" stroke="#d4af37" stroke-width=".5" opacity=".5"/>
            <path d="M20 12 L20 28 M12 20 L28 20" stroke="#d4af37" stroke-width=".8" opacity=".6"/>
          </svg>
        </div>
        <div class="cover-title">${currentLevel.name}</div>
        <div class="cover-sub">聖典圖書館</div>
      `;
    } else if(pageNum==='backcover'){
      // 封底半邊（右頁）
      pg.classList.add('cover-page');
      pg.innerHTML = `
        <div class="cover-ornament">
          <svg viewBox="0 0 40 40" width="30" height="30">
            <circle cx="20" cy="20" r="14" fill="none" stroke="#d4af37" stroke-width="1" opacity=".5"/>
            <path d="M14 20 Q20 14 26 20 Q20 26 14 20" fill="none" stroke="#d4af37" stroke-width=".8" opacity=".6"/>
          </svg>
        </div>
        <div class="cover-sub" style="margin-top:auto;">歸序完成</div>
      `;
    } else if(pageNum===null || pageNum===undefined){
      // 空白頁（不標籤）
      pg.innerHTML = '';
    } else {
      pg.innerHTML = `<div class="bpage-label">第 ${pageNum} 頁</div>`;
      const slot = document.createElement('div');
      slot.className = 'page-slot';
      slot.dataset.page = pageNum;
      const placedSlip = puzzleState.data.placed[pageNum-1];
      if(placedSlip){
        slot.classList.add('filled');
        slot.innerHTML = `<div class="paper-slip placed"><span class="slip-text">${placedSlip.text}</span></div>`;
        slot.onclick = ()=>{
          puzzleState.data.placed[pageNum-1] = null;
          sfxPlace();
          renderBook(); renderTray();
        };
      } else {
        slot.innerHTML = `<span class="slot-hint">點擊貼上紙條</span>`;
        slot.onclick = ()=>{
          if(puzzleState.data.selectedSlip===null){ toast('請先在下方選擇一張紙條'); return; }
          puzzleState.data.placed[pageNum-1] = puzzleState.data.selectedSlip;
          puzzleState.data.selectedSlip = null;
          sfxPlace();
          renderBook(); renderTray();
        };
      }
      pg.appendChild(slot);
    }
    return pg;
  }

  el.appendChild(makePage('left', spread.left));
  el.appendChild(makePage('right', spread.right));
  stage.querySelector('.open-book').appendChild(el);

  // 導航按鈕狀態
  const prevBtn = stage.querySelector('[data-nav="prev"]');
  const nextBtn = stage.querySelector('[data-nav="next"]');
  prevBtn.classList.toggle('disabled', sp===0);
  nextBtn.classList.toggle('disabled', sp===spreads.length-1);
  prevBtn.onclick = ()=>{
    if(sp===0) return;
    sfxPage();
    puzzleState.data.state = sp-1;
    renderBook();
  };
  nextBtn.onclick = ()=>{
    if(sp===spreads.length-1) return;
    sfxPage();
    puzzleState.data.state = sp+1;
    renderBook();
  };
}

function renderTray(){
  const tray = puzzleState.data.tray;
  tray.innerHTML = '';
  puzzleState.data.slips.forEach((slip,i)=>{
    // 已放置的紙條不在托盤顯示
    if(puzzleState.data.placed.includes(slip)) return;
    const c = document.createElement('div');
    c.className = 'paper-slip' + (puzzleState.data.selectedSlip===slip?' selected':'');
    c.innerHTML = `<span class="slip-text">${slip.text}</span><span class="slip-num">紙條</span>`;
    c.onclick = ()=>{
      sfxPickup();
      puzzleState.data.selectedSlip = slip;
      renderTray();
    };
    tray.appendChild(c);
  });
}

function checkOrderBook(){
  const n = currentLevel.pages.length;
  // 檢查是否全部貼滿
  if(puzzleState.data.placed.includes(null)){
    toast('尚有頁面未歸位');
    sfxWrong();
    return;
  }
  // 清除舊錯誤標記
  document.querySelectorAll('.page-slot').forEach(s=>s.classList.remove('error'));
  // 檢查每頁是否正確（slot i 應放置 n===i+1 的紙條）
  let allCorrect = true;
  puzzleState.data.placed.forEach((slip, idx)=>{
    if(slip.n !== idx+1){
      allCorrect = false;
      // 標記該頁為錯誤
      const slot = document.querySelector(`.page-slot[data-page="${idx+1}"]`);
      if(slot) slot.classList.add('error');
    }
  });
  if(allCorrect){
    sfxSuccess();
    setTimeout(()=>onSolve(), 500);
  } else {
    sfxWrong();
    toast('排序有誤，紅框處請調整');
  }
}

/* ----- 2. 殘頁拼接 ----- */
function buildPiece(lv, area){
  const n = lv.gridSize;
  const total = n*n;
  puzzleState.data.size = n;
  puzzleState.data.placed = new Array(total).fill(null); // slotIdx -> pieceIdx
  puzzleState.data.selected = -1;
  puzzleState.data.palette = lv.palette;
  // 打亂順序
  const order = [...Array(total).keys()].sort(()=>Math.random()-0.5);
  puzzleState.data.order = order;

  const grid = document.createElement('div');
  grid.className = 'puzzle-grid';
  grid.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  const slotSize = n===2 ? 110 : 80;
  for(let i=0;i<total;i++){
    const slot = document.createElement('div');
    slot.className = 'grid-slot';
    slot.style.width = slotSize+'px';
    slot.style.height = slotSize+'px';
    slot.dataset.idx = i;
    slot.onclick = ()=>placePiece(i, grid, tray);
    grid.appendChild(slot);
  }
  area.appendChild(grid);

  const tray = document.createElement('div');
  tray.className = 'tray';
  order.forEach(pieceIdx=>{
    const piece = document.createElement('div');
    piece.className = 'tray-piece';
    piece.style.width = slotSize+'px';
    piece.style.height = slotSize+'px';
    piece.style.background = lv.palette[pieceIdx];
    piece.dataset.piece = pieceIdx;
    piece.onclick = ()=>{
      sfxPickup();
      puzzleState.data.selected = pieceIdx;
      document.querySelectorAll('.tray-piece').forEach(p=>p.classList.remove('selected'));
      piece.classList.add('selected');
    };
    tray.appendChild(piece);
  });
  area.appendChild(tray);
}
function placePiece(slotIdx, grid, tray){
  if(puzzleState.data.selected===-1){
    // 點擊已放置的 slot 可歸還
    if(puzzleState.data.placed[slotIdx]!==null){
      const pieceIdx = puzzleState.data.placed[slotIdx];
      puzzleState.data.placed[slotIdx] = null;
      const slot = grid.children[slotIdx];
      slot.classList.remove('filled','locked');
      slot.innerHTML = '';
      // 恢復 tray 中該 piece
      const piece = tray.querySelector(`[data-piece="${pieceIdx}"]`);
      piece.classList.remove('placed');
      sfxPlace();
    }
    return;
  }
  const pieceIdx = puzzleState.data.selected;
  // 如果該 slot 已有 piece，先歸還
  if(puzzleState.data.placed[slotIdx]!==null){
    const old = puzzleState.data.placed[slotIdx];
    tray.querySelector(`[data-piece="${old}"]`).classList.remove('placed');
  }
  puzzleState.data.placed[slotIdx] = pieceIdx;
  puzzleState.data.selected = -1;
  const slot = grid.children[slotIdx];
  slot.classList.add('filled');
  slot.style.background = puzzleState.data.palette[pieceIdx];
  slot.innerHTML = '';
  tray.querySelector(`[data-piece="${pieceIdx}"]`).classList.add('placed');
  document.querySelectorAll('.tray-piece').forEach(p=>p.classList.remove('selected'));
  sfxPlace();
  // 檢查
  let correct = true;
  for(let i=0;i<puzzleState.data.placed.length;i++){
    if(puzzleState.data.placed[i]!==i){ correct=false; break; }
  }
  if(correct){
    // 鎖定所有 slot
    [...grid.children].forEach(s=>s.classList.add('locked'));
    setTimeout(onSolve, 400);
  } else {
    // 簡單回饋：若放錯，輕微閃一下（不強制復原，鼓勵嘗試）
    if(puzzleState.data.placed[slotIdx]!==slotIdx){
      slot.style.transition='all .3s';
      setTimeout(()=>{ slot.style.opacity='0.5'; }, 50);
      setTimeout(()=>{ slot.style.opacity='1'; }, 300);
    } else {
      sfxCorrect();
    }
  }
}

/* ----- 3. 符文淨化 ----- */
function buildRune(lv, area){
  const runes = lv.runes;
  const n = runes.length;
  puzzleState.data.sequence = [];
  puzzleState.data.total = n;

  const circle = document.createElement('div');
  circle.className = 'rune-circle';
  const center = document.createElement('div');
  center.className = 'rune-center';
  center.textContent = '依序\n淨化';
  circle.appendChild(center);

  const radius = 100;
  runes.forEach((r,i)=>{
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    const x = 140 + radius*Math.cos(angle) - 28;
    const y = 140 + radius*Math.sin(angle) - 28;
    const node = document.createElement('div');
    node.className = 'rune-node';
    node.style.left = x+'px';
    node.style.top = y+'px';
    node.textContent = r.label;
    node.dataset.order = r.order;
    node.onclick = ()=>{
      const expected = puzzleState.data.sequence.length+1;
      if(r.order===expected){
        node.classList.add('lit');
        puzzleState.data.sequence.push(r.order);
        sfxCorrect();
        if(puzzleState.data.sequence.length===n){
          setTimeout(onSolve, 500);
        }
      } else {
        node.classList.add('wrong');
        sfxWrong();
        setTimeout(()=>{
          node.classList.remove('wrong');
          // 重置已點亮
          document.querySelectorAll('.rune-node').forEach(nd=>nd.classList.remove('lit'));
          puzzleState.data.sequence = [];
        }, 500);
        toast('順序有誤，請重新開始');
      }
    };
    circle.appendChild(node);
  });
  area.appendChild(circle);
}

function buildCate(lv, area){
  puzzleState.data.placed = {}; // cardIdx -> true
  puzzleState.data.selected = -1;
  // 打亂卡片
  const cards = [...lv.cards].map((c,i)=>({...c, origIdx:i})).sort(()=>Math.random()-0.5);
  puzzleState.data.cards = cards;

  const zones = document.createElement('div');
  zones.className = 'cate-zones';
  lv.categories.forEach((cat,ci)=>{
    const z = document.createElement('div');
    z.className = 'cate-zone';
    z.dataset.cate = cat.id;
    z.innerHTML = `<div class="zone-title">${cat.name}</div><div class="zone-cards" style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:flex-end;min-height:70px;"></div>`;
    z.onclick = ()=>{
      if(puzzleState.data.selected===-1) return;
      const selOrigIdx = puzzleState.data.selected;
      const card = cards.find(c=>c.origIdx===selOrigIdx);
      if(!card) return;
      if(card.cate===cat.id){
        // 正確放入
        puzzleState.data.placed[card.origIdx] = true;
        const holder = z.querySelector('.zone-cards');
        const mb = makeMiniBook(card, cat.id, cat.name);
        mb.style.cursor = 'pointer';
        mb.onclick = (e)=>{
          e.stopPropagation();
          // 取出放回托盤
          mb.remove();
          delete puzzleState.data.placed[card.origIdx];
          const origCard = area.querySelector(`.mini-book[data-idx="${card.origIdx}"]`);
          if(origCard) origCard.classList.remove('placed');
          sfxPlace();
        };
        holder.appendChild(mb);
        // 標記原卡片
        const origCard = area.querySelector(`.mini-book[data-idx="${card.origIdx}"]`);
        if(origCard) origCard.classList.add('placed');
        puzzleState.data.selected = -1;
        sfxCorrect();
        // 檢查是否全部完成
        if(Object.keys(puzzleState.data.placed).length===cards.length){
          [...zones.children].forEach(zz=>zz.classList.add('correct'));
          setTimeout(onSolve, 400);
        }
      } else {
        sfxWrong();
        toast('歸類有誤');
      }
    };
    zones.appendChild(z);
  });
  area.appendChild(zones);

  const tray = document.createElement('div');
  tray.className = 'tray';
  cards.forEach(card=>{
    const cat = lv.categories.find(c=>c.id===card.cate);
    const mb = makeMiniBook(card, card.cate, cat.name);
    mb.dataset.idx = card.origIdx;
    mb.onclick = ()=>{
      if(puzzleState.data.placed[card.origIdx]) return;
      sfxPickup();
      puzzleState.data.selected = card.origIdx;
      tray.querySelectorAll('.mini-book').forEach(x=>x.classList.remove('selected'));
      mb.classList.add('selected');
    };
    tray.appendChild(mb);
  });
  area.appendChild(tray);
}

/* ----- 5. 古籍解密 ----- */
function buildDecrypt(lv, area){
  puzzleState.data.answers = new Array(lv.blanks.length).fill(null);
  // 建立模板
  const textDiv = document.createElement('div');
  textDiv.className = 'decrypt-text';
  let html = '';
  let bi = 0;
  lv.template.split('____').forEach((part,i)=>{
    html += part;
    if(i < lv.blanks.length){
      html += `<span class="blank" data-bi="${bi}">＿＿</span>`;
      bi++;
    }
  });
  textDiv.innerHTML = html;
  area.appendChild(textDiv);

  // 選項池（所有選項打亂）
  const allChoices = [];
  lv.blanks.forEach((b,i)=>{
    b.options.forEach(opt=>allChoices.push({text:opt, bi:i}));
  });
  allChoices.sort(()=>Math.random()-0.5);

  const choices = document.createElement('div');
  choices.className = 'choices';
  allChoices.forEach(ch=>{
    const chip = document.createElement('div');
    chip.className = 'choice-chip';
    chip.textContent = ch.text;
    chip.onclick = ()=>{
      // 找到第一個未填的 blank
      let targetBi = puzzleState.data.answers.findIndex(a=>a===null);
      if(targetBi===-1){ toast('所有缺字已填，請檢查'); return; }
      puzzleState.data.answers[targetBi] = ch.text;
      chip.classList.add('used');
      const blank = textDiv.querySelector(`[data-bi="${targetBi}"]`);
      blank.textContent = ch.text;
      blank.classList.add('filled');
      sfxPlace();
      // 若全部填完，檢查
      if(puzzleState.data.answers.every(a=>a!==null)){
        let allCorrect = true;
        puzzleState.data.answers.forEach((ans,i)=>{
          const blank = textDiv.querySelector(`[data-bi="${i}"]`);
          if(ans===lv.blanks[i].answer){
            blank.classList.add('correct');
          } else {
            blank.classList.add('wrong');
            allCorrect = false;
          }
        });
        if(allCorrect){
          setTimeout(onSolve, 600);
        } else {
          sfxWrong();
          toast('有缺字有誤，請重置後重試');
          setTimeout(()=>buildPuzzle(lv), 1200);
        }
      }
    };
    choices.appendChild(chip);
  });
  area.appendChild(choices);
}

/* ----- 7. 法則約束排列 ----- */
function buildConstraint(lv, area){
  const n = lv.elements.length;
  puzzleState.data.slots = new Array(n).fill(null); // slotIdx -> element name
  puzzleState.data.selected = null; // element name selected in tray
  puzzleState.data.elements = [...lv.elements].sort(()=>Math.random()-0.5);

  // 約束圖示 SVG
  const ICONS_RULE = {
    adj: `<svg viewBox="0 0 28 20"><circle cx="6" cy="10" r="4" fill="none" stroke="#c9a96e" stroke-width="1.5"/><path d="M10 10 L18 10" stroke="#c9a96e" stroke-width="1.5"/><circle cx="22" cy="10" r="4" fill="none" stroke="#c9a96e" stroke-width="1.5"/></svg>`,
    gap: `<svg viewBox="0 0 28 20"><circle cx="5" cy="10" r="4" fill="none" stroke="#c9a96e" stroke-width="1.5"/><circle cx="14" cy="10" r="1.5" fill="#c9a96e"/><circle cx="23" cy="10" r="4" fill="none" stroke="#c9a96e" stroke-width="1.5"/></svg>`,
    notadj: `<svg viewBox="0 0 28 20"><circle cx="5" cy="10" r="4" fill="none" stroke="#c9a96e" stroke-width="1.5"/><path d="M11 6 L17 14 M17 6 L11 14" stroke="#b85450" stroke-width="1.5"/><circle cx="23" cy="10" r="4" fill="none" stroke="#c9a96e" stroke-width="1.5"/></svg>`,
  };

  // 約束清單
  const rulesDiv = document.createElement('div');
  rulesDiv.className = 'constraint-rules';
  rulesDiv.innerHTML = '<div style="font-size:12px;color:var(--gold-soft);letter-spacing:2px;margin-bottom:2px;">法則約束</div>';
  lv.constraints.forEach((c,i)=>{
    const r = document.createElement('div');
    r.className = 'rule-item';
    r.dataset.ruleIdx = i;
    r.innerHTML = `<div class="rule-icon">${ICONS_RULE[c.type]}</div><span>${c.label}</span>`;
    rulesDiv.appendChild(r);
  });
  area.appendChild(rulesDiv);

  // 位次格子
  const slotsDiv = document.createElement('div');
  slotsDiv.className = 'constraint-slots';
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className = 'cslot';
    s.dataset.slot = i;
    s.onclick = ()=>{
      // 若格子已有元素，點擊歸還到托盤
      if(puzzleState.data.slots[i]!==null){
        const el = puzzleState.data.slots[i];
        puzzleState.data.slots[i] = null;
        s.classList.remove('filled','violation');
        s.innerHTML = '';
        const piece = area.querySelector(`.cpiece[data-el="${el}"]`);
        if(piece) piece.classList.remove('placed');
        sfxPlace();
        return;
      }
      // 否則放置當前選中的元素
      if(puzzleState.data.selected===null){ toast('請先選擇一個元素卡牌'); return; }
      const el = puzzleState.data.selected;
      puzzleState.data.slots[i] = el;
      puzzleState.data.selected = null;
      s.classList.add('filled');
      s.innerHTML = `<div class="cpiece">${el}</div>`;
      const piece = area.querySelector(`.cpiece[data-el="${el}"]`);
      if(piece) piece.classList.add('placed');
      area.querySelectorAll('.cpiece').forEach(p=>p.classList.remove('selected'));
      sfxPlace();
    };
    slotsDiv.appendChild(s);
  }
  area.appendChild(slotsDiv);

  // 托盤
  const tray = document.createElement('div');
  tray.className = 'tray';
  puzzleState.data.elements.forEach(el=>{
    const c = document.createElement('div');
    c.className = 'cpiece';
    c.dataset.el = el;
    c.textContent = el;
    c.onclick = ()=>{
      if(c.classList.contains('placed')) return;
      sfxPickup();
      puzzleState.data.selected = el;
      tray.querySelectorAll('.cpiece').forEach(p=>p.classList.remove('selected'));
      c.classList.add('selected');
    };
    tray.appendChild(c);
  });
  area.appendChild(tray);

  // 檢查按鈕
  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn primary small';
  checkBtn.textContent = '檢查約束';
  checkBtn.onclick = ()=>checkConstraints(lv, area, rulesDiv);
  area.appendChild(checkBtn);
}

function checkConstraints(lv, area, rulesDiv){
  // 必須所有格子都填滿
  if(puzzleState.data.slots.includes(null)){
    toast('請先排滿所有位次');
    sfxWrong();
    return;
  }
  const pos = {};
  puzzleState.data.slots.forEach((el,i)=>pos[el]=i);
  let allOk = true;
  lv.constraints.forEach((c,i)=>{
    const d = Math.abs(pos[c.a]-pos[c.b]);
    let ok = false;
    if(c.type==='adj') ok = (d===1);
    else if(c.type==='gap') ok = (d===2);
    else if(c.type==='notadj') ok = (d!==1);
    const ruleEl = rulesDiv.querySelector(`[data-rule-idx="${i}"]`);
    ruleEl.classList.remove('ok','bad');
    ruleEl.classList.add(ok?'ok':'bad');
    if(!ok) allOk = false;
  });
  // 標記違反的元素位置
  const slots = area.querySelectorAll('.cslot');
  slots.forEach(s=>s.classList.remove('violation'));
  if(!allOk){
    sfxWrong();
    // 高亮違反約束的元素
    lv.constraints.forEach((c,i)=>{
      const d = Math.abs(pos[c.a]-pos[c.b]);
      let ok=false;
      if(c.type==='adj') ok=(d===1);
      else if(c.type==='gap') ok=(d===2);
      else ok=(d!==1);
      if(!ok){
        [c.a,c.b].forEach(el=>{
          const si = puzzleState.data.slots.indexOf(el);
          if(si>=0) slots[si].classList.add('violation');
        });
      }
    });
    toast('部分約束未滿足，請調整');
  } else {
    sfxSuccess();
    setTimeout(()=>onSolve(), 600);
  }
}

/* ---------- 通關處理 ---------- */
function onSolve(){
  if(puzzleState.solved) return;
  puzzleState.solved = true;
  sfxSuccess();
  const lv = currentLevel;
  // 計算星級（簡單：固定 3 星，因無計時）
  const stars = 3;
  const firstTime = !S.completed[lv.id];
  // 秩序值加成
  let reward = lv.reward;
  const dustLv = S.upgrades['dust']||0;
  reward = Math.round(reward * (1 + dustLv*0.1));
  if(firstTime){
    S.orderPoints += reward;
    S.completed[lv.id] = stars;
    S.codex[lv.id] = true;
    if(lv.codex && lv.codex.spirit){
      S.spirits[lv.codex.spirit] = true;
    }
  } else {
    S.orderPoints += Math.round(reward*0.2); // 重玩獎勵減半
  }
  saveGame();
  // 成功彈窗
  document.getElementById('successText').textContent = lv.storyAfter;
  let rewardText = `秩序值 +${firstTime?reward:Math.round(reward*0.2)}`;
  if(firstTime && lv.codex && lv.codex.spirit){
    rewardText += `　·　喚醒書靈「${SPIRITS[lv.codex.spirit].name}」`;
  } else if(firstTime){
    rewardText += `　·　圖鑑解鎖`;
  }
  document.getElementById('successReward').textContent = rewardText;
  document.getElementById('successOverlay').classList.add('show');
}

function renderUpgrades(){
  document.getElementById('colOrder').textContent = S.orderPoints;
  const body = document.getElementById('colBody');
  body.innerHTML = '';
  const list = document.createElement('div');
  list.className = 'upgrade-list';
  UPGRADES.forEach(up=>{
    const lv = S.upgrades[up.id]||0;
    const maxed = lv>=up.max;
    const cost = up.cost * (lv+1);
    const item = document.createElement('div');
    item.className = 'upgrade-item';
    item.innerHTML = `
      <div class="up-info">
        <div class="up-name">${up.name} <span style="color:var(--gold-soft);font-size:11px;">Lv.${lv}/${up.max}</span></div>
        <div class="up-desc">${up.desc}</div>
      </div>
      <div class="up-cost">${maxed?'已滿級':cost+' 秩序值'}</div>
    `;
    if(!maxed){
      const btn = document.createElement('button');
      btn.className = 'btn small';
      btn.textContent = '升級';
      btn.disabled = S.orderPoints < cost;
      btn.onclick = ()=>{
        if(S.orderPoints < cost){ toast('秩序值不足'); return; }
        S.orderPoints -= cost;
        S.upgrades[up.id] = lv+1;
        saveGame();
        sfxSuccess();
        renderUpgrades();
      };
      item.appendChild(btn);
    }
    list.appendChild(item);
  });
  body.appendChild(list);
}
